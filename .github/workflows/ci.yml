name: syntax-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff>=0.8,<1" "pytest>=8,<10"
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: ruff check --select E9,F63,F7,F82 .
      - run: python -m compileall -q .
      - run: python -m pytest -q

  numpy1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      # 主 job 使用最新 NumPy（2.x）；这里额外验证 1.x 的 np.trapz 回退分支
      - run: python -m pip install "numpy>=1.24,<2"
      - run: python -m pytest -q